requires-python = ">=3.9"
dependencies = [
    "streamlit==1.50.0",
    "pandas==2.3.3",
    "numpy==2.0.2",
    "scikit-learn==1.6.1",
    "joblib==1.5.3",
    "matplotlib==3.9.4",
    "shap==0.46.0",
    "lime==0.2.0.1",
    "xgboost==2.1.4",
    "lightgbm==4.6.0",
    "imbalanced-learn==0.12.4",
]
